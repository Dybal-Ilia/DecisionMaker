name: Python CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                enable-cahce: true
            
            - name: Set up Python
              run: uv python install 3.12
            
            - name: Install dependencies
              run: uv sync

            - name: Lint with Ruff
              run: uv run ruff check .
            
            