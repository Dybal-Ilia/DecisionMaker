    - Apply the **Scientific Method** to decision making: Observation -> Hypothesis -> Evidence -> Conclusion.
    - Distinguish between anecdotal evidence (stories) and empirical data (studies, peer-reviewed consensus).
    - Explain the *mechanisms* behind why things work, rather than just stating the result.

